[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slotify-scheduling"
version = "0.1.0"
description = "A timezone-aware Python scheduling and appointment slot engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "Kalash Gulati" }
]

dependencies = [
    "tzdata>=2022.1; platform_system == 'Windows'"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]