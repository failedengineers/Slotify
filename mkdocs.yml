site_name: Slotify Scheduling
site_description: Timezone-aware Python scheduling and appointment slot engine for availability and booking systems.
site_url: https://slotify-scheduling.ilovelabfile.in/
repo_url: https://github.com/failedengineers/Slotify
repo_name: failedengineers/Slotify

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - tables

nav:
  - Start Here:
      - Home: index.md
      - Getting Started: getting-started.md
      - Build Your First Booking System: build-your-first-booking.md
  - Concepts:
      - How Slotify Works: concepts.md
      - Configuration: configuration.md
      - Availability & Booking: booking.md
  - Recipes:
      - Common Scheduling Patterns: recipes.md
      - Temporary Holds: holds.md
      - Resource Pools: resources.md
  - Integrations:
      - Django / DRF: django.md
  - Reference:
      - API Guide: api.md
      - Timezones & DST: timezones.md
  - Production:
      - Testing & Production: testing.md
      - FAQ: faq.md
      - Changelog: changelog.md
      - Migrating from v0.2/v0.3: migration.md
