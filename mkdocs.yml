site_name: Slotify Scheduling
site_description: Timezone-aware Python scheduling and appointment slot engine for availability and booking systems.
site_url: https://failedengineers.github.io/Slotify/
repo_url: https://github.com/failedengineers/Slotify
repo_name: failedengineers/Slotify

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - tables

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Concepts: concepts.md
  - Configuration: configuration.md
  - Availability & Booking: booking.md
  - Integration:
      - Django / DRF: django.md
  - Core:
      - Timezones & DST: timezones.md
      - Recipes: recipes.md
      - API Guide: api.md
  - Guides:
      - Testing & Production: testing.md
      - Migrating to v0.2.0: migration.md
      - FAQ: faq.md
      - Changelog: changelog.md
